name: Android Release APK

on:
  push:
    paths:
      - 'android/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'android/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmdline-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check Supabase app configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Supabase client configuration: available" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Supabase client configuration is missing; the APK will show setup guidance instead of uploaded tracks. Add repository Actions variables/secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY."
            echo "Supabase client configuration: **missing** (APK will not load real tracks until configured)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build signed release APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set +e
          gradle :android:app:assembleRelease --console=plain -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^e: |error:|What went wrong:|Could not resolve|No matching variant|failed to resolve)' android-build.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JaMusic-android-build-log
          path: android-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: JaMusic-app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
